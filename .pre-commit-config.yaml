repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=750"]
      - id: debug-statements
  - repo: https://github.com/ambv/black
    rev: 22.3.0
    hooks:
      - id: black
        language_version: python3
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]
        language_version: python3
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args:
          [
            "--max-line-length",
            "88",
            "--extend-ignore",
            "E203,E402,E501",
            "--per-file-ignores",
            "__init__.py:F401",
          ]
  - repo: https://github.com/myint/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        args:
          [
            "--in-place",
            "--remove-unused-variables",
            "--remove-all-unused-imports",
            "--ignore-init-module-imports",
            "--exclude=tests/*",
          ]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [markdown, yaml]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v1.7.1"
    hooks:
      - id: mypy
        additional_dependencies:
          [
            types-PyYAML==6.0.12.11,
            "types-requests",
            "sqlmodel",
            "types-Markdown",
            "types-cachetools",
            types-tzlocal,
          ]
        args:
          [
            "--check-untyped-defs",
            "--ignore-missing-imports",
            "--explicit-package-bases",
            "--follow-imports=skip",
          ]
        exclude: >-
          ^(templates/|tests/test_(feedback_repair|vectorindex_hybrid_regression)\.py$|src/ktem/(evaluation/ragas_eval|index/file/(index|ingestion_v2)|pages/chat/__init__|utils/chat_export)\.py$|src/kotaemon/(embeddings/tei_endpoint_embed|indices/(splitters/university_pdf|vectorindex)|llms/linear)\.py$|flowsettings\.py$)
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.4
    hooks:
      - id: codespell
        exclude: >-
          ^(dataset/|rag_eval_dataset.*\.json$|tests/test_(university_pdf_pipeline|vectorindex_hybrid_regression)\.py$|src/kotaemon/(indices/(vectorindex|splitters/university_pdf)|loaders/docling_loader)\.py$|src/ktem/index/file/ingestion_v2\.py$|scripts/(eval_university_retrieval|university_rag_smoke)\.py$)
        additional_dependencies:
          - tomli
