name: unit-test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "langchain>=0.2.17,<0.3" \
            "llama-index-core>=0.10.40,<0.11" \
            "markdown>=3.6,<4" \
            "pandas>=2.2.2,<2.3" \
            "python-decouple>=3.8,<4" \
            "sqlalchemy>=2.0.29,<3" \
            "sqlmodel>=0.0.16,<0.1" \
            "theflow>=0.8.6,<0.9" \
            "tiktoken>=0.6,<1" \
            "tzlocal>=5" \
            pytest
          python -m pip install -e . --no-deps

      - name: Run tests
        run: pytest -q tests
